name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Setup Java (requerido por Android) ──────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Setup Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ── Instalar dependencias ────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/mobile

      # ── Build APK release universal ──────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release
        working-directory: apps/mobile

      # ── Renombrar APK universal con versión ──────────────────────────────
      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd apps/mobile/build/app/outputs/flutter-apk
          mv app-release.apk MyLifeOS-${VERSION}.apk

      # ── Crear Release con APK adjunto ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MyLifeOS ${{ steps.version.outputs.VERSION }}"
          body: |
            ## MyLifeOS ${{ steps.version.outputs.VERSION }}

            Nueva versión disponible con mejoras internas, sincronización cloud con WalletAI e integración OTA.

            ### Instalación en Android
            - **APK Universal (`MyLifeOS-${{ steps.version.outputs.VERSION }}.apk`)** compatible con dispositivos arm64, arm32 y x86_64.

            Habilita "Instalar apps de fuentes desconocidas" en Ajustes → Seguridad.

            > Los usuarios con la app instalada recibirán una actualización automática (OTA).
          files: |
            apps/mobile/build/app/outputs/flutter-apk/MyLifeOS-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
