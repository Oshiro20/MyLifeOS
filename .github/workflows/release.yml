name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Setup Java (requerido por Android) ──────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Setup Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      # ── Instalar dependencias ────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/mobile

      # ── Build APK release ────────────────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: apps/mobile

      # ── Renombrar APKs con versión ───────────────────────────────────────
      - name: Rename APKs
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd apps/mobile/build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk MyLifeOS-${VERSION}-arm64.apk
          mv app-armeabi-v7a-release.apk MyLifeOS-${VERSION}-arm32.apk
          mv app-x86_64-release.apk MyLifeOS-${VERSION}-x86_64.apk

      # ── Crear Release con APKs adjuntos ─────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MyLifeOS ${{ steps.version.outputs.VERSION }}"
          body: |
            ## MyLifeOS ${{ steps.version.outputs.VERSION }}

            Nueva versión disponible.

            ### Instalación en Android
            Descarga el APK según tu dispositivo:
            - **arm64** → la mayoría de teléfonos modernos (2017+)
            - **arm32** → teléfonos más antiguos
            - **x86_64** → emuladores

            Habilita "Instalar apps de fuentes desconocidas" en Ajustes → Seguridad.

            > Los usuarios con la app instalada recibirán una notificación automática.
          files: |
            apps/mobile/build/app/outputs/flutter-apk/MyLifeOS-${{ steps.version.outputs.VERSION }}-arm64.apk
            apps/mobile/build/app/outputs/flutter-apk/MyLifeOS-${{ steps.version.outputs.VERSION }}-arm32.apk
            apps/mobile/build/app/outputs/flutter-apk/MyLifeOS-${{ steps.version.outputs.VERSION }}-x86_64.apk
          draft: false
          prerelease: false
