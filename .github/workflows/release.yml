name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── Setup Java (requerido por Android) ──────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── Setup Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'
          cache: true

      # ── Instalar dependencias ────────────────────────────────────────────
      - name: Flutter pub get
        run: flutter pub get
        working-directory: apps/mobile

      # ── Configurar firma oficial persistente ─────────────────────────────
      - name: Setup Android Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MYLIFEOS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MYLIFEOS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.MYLIFEOS_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MYLIFEOS_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: Faltan secretos de firma (MYLIFEOS_KEYSTORE_BASE64 / PASSWORDS / ALIAS)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > apps/mobile/android/app/mylifeos-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=mylifeos-release.jks\n" \
            "$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')" \
            "$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')" \
            "$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')" > apps/mobile/android/key.properties
          keytool -list -keystore apps/mobile/android/app/mylifeos-release.jks \
            -storepass "$(printf '%s' "$STORE_PASSWORD" | tr -d '\r\n')" | grep -E "Alias|SHA256" || true

      # ── Preparar defines de entorno (.env temporal de compilación) ───────
      - name: Prepare Dart Defines
        env:
          TIKTOK_API_KEY: ${{ secrets.TIKTOK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          : > .env.build
          [ -n "$TIKTOK_API_KEY" ] && printf "TIKTOK_API_KEY=%s\n" "$TIKTOK_API_KEY" >> .env.build || true
          [ -n "$GEMINI_API_KEY" ] && printf "GEMINI_API_KEY=%s\n" "$GEMINI_API_KEY" >> .env.build || true
          [ -n "$SUPABASE_URL" ] && printf "SUPABASE_URL=%s\n" "$SUPABASE_URL" >> .env.build || true
          [ -n "$SUPABASE_ANON_KEY" ] && printf "SUPABASE_ANON_KEY=%s\n" "$SUPABASE_ANON_KEY" >> .env.build || true

      # ── Build APK release universal ──────────────────────────────────────
      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=../../.env.build
        working-directory: apps/mobile

      - name: Cleanup env defines
        if: always()
        run: rm -f .env.build

      # ── Renombrar APK universal con versión ──────────────────────────────
      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          cd apps/mobile/build/app/outputs/flutter-apk
          mv app-release.apk MyLifeOS-${VERSION}.apk

      # ── Crear Release con APK adjunto ────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MyLifeOS ${{ steps.version.outputs.VERSION }}"
          body: |
            ## MyLifeOS ${{ steps.version.outputs.VERSION }}

            Nueva versión disponible con mejoras internas, sincronización cloud con WalletAI e integración OTA.

            ### Instalación en Android
            - **APK Universal (`MyLifeOS-${{ steps.version.outputs.VERSION }}.apk`)** compatible con dispositivos arm64, arm32 y x86_64.

            Habilita "Instalar apps de fuentes desconocidas" en Ajustes → Seguridad.

            > Los usuarios con la app instalada recibirán una actualización automática (OTA).
          files: |
            apps/mobile/build/app/outputs/flutter-apk/MyLifeOS-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
