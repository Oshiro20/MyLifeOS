name: MyLifeOS Release

on:
  push:
    tags:
      - 'v*' # Se ejecuta al pushear un tag que empiece con "v" (ej: v1.0.0)

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Recibe el código fuente
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'

      - name: Instalar dependencias
        run: |
          cd apps/mobile
          flutter pub get

      - name: Compilar APK (Release)
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Crear Release y subir APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
