publish_to: 'none'
version: 0.0.1

resolution: workspace

environment:
  sdk: ^3.3.4

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.31.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.5
  path: ^1.9.1
